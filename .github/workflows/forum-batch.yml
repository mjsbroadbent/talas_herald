name: FREEFORUM hand-written batches

# Pushing a new or changed .json file in newsroom/forum_batches/ queues it on the forum.
# Files starting with "_" (examples, drafts) are ignored. A batch name can only be queued once.
on:
  push:
    branches: [main]
    paths: ["newsroom/forum_batches/*.json"]
  workflow_dispatch:
    inputs:
      file:
        description: "Batch file to queue (e.g. newsroom/forum_batches/irad-times-block.json)"
        required: true
      dry_run:
        description: "Check and show the schedule only"
        type: boolean
        default: false

concurrency:
  group: forum
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Queue the batch files
        env:
          FORUM_LIVE_KEY: ${{ secrets.FORUM_LIVE_KEY }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$FORUM_LIVE_KEY" ]; then
            echo "::error::Add a FORUM_LIVE_KEY repository secret (the same as live_key in freeirad-secrets.php)."; exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES="${{ inputs.file }}"
            ARGS=""; [ "${{ inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              FILES=$(git ls-files 'newsroom/forum_batches/*.json')
            else
              FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'newsroom/forum_batches/*.json')
            fi
            FILES=$(printf '%s\n' $FILES | grep -v '/_' || true)
            ARGS=""
          fi
          if [ -z "$FILES" ]; then echo "::notice::No batch files to queue"; exit 0; fi
          python newsroom/forum_batch.py $FILES $ARGS
