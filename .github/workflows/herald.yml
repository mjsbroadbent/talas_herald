name: Talas Herald newsroom

on:
  schedule:
    # Hourly from 05:41 to 12:41 Irad Time (UTC+6), Monday to Saturday in Irad.
    # Each run first checks, for free, whether today's edition is due; most stop there.
    - cron: "41 23 * * 0-5"
    - cron: "41 0-6 * * 1-6"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish stories now, whatever the day"
        type: boolean
        default: true
      editorial:
        description: "Also write The Herald's View now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: herald
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is the edition due?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Manual run: publishing now."
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            python newsroom/herald.py due
          fi

      - name: Check out the Irad lore
        if: steps.check.outputs.due == 'true'
        uses: actions/checkout@v4
        with:
          repository: mjsbroadbent/irad_persona_skill
          token: ${{ secrets.LORE_TOKEN || github.token }}
          path: _lore
          sparse-checkout: |
            quickref.md
            canon.md
          sparse-checkout-cone-mode: false

      - name: Install dependencies
        if: steps.check.outputs.due == 'true'
        run: pip install -r newsroom/requirements.txt

      - name: Write the paper
        if: steps.check.outputs.due == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LORE_DIR: _lore
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add an ANTHROPIC_API_KEY repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
            [ "${{ inputs.editorial }}" = "true" ] && ARGS="$ARGS --editorial" || ARGS="$ARGS --no-editorial"
          fi
          python newsroom/herald.py run $ARGS

      - name: Publish
        if: always() && steps.check.outputs.due == 'true'
        run: |
          git config user.name "Talas Herald Newsroom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data news section archive index.html feed.xml sitemap.xml newsroom/last_run.log
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "Herald: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin main
          git push
