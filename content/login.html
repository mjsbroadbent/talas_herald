<!-- title: Log in -->
<div class="login-wrap">
  <h1 class="login-head">Log in</h1>
  <p class="login-sub">Subscribers can read every story and the full archive since 1993.</p>
  <form class="login-form" id="login-form" autocomplete="off" novalidate>
    <p class="login-error" id="login-error" role="alert" hidden></p>
    <label for="login-user">Email or subscriber number</label>
    <input id="login-user" name="user" type="text" autocomplete="off" spellcheck="false">
    <label for="login-pass">Password</label>
    <input id="login-pass" name="pass" type="password" autocomplete="off">
    <label class="login-remember"><input type="checkbox" id="login-remember"> Keep me logged in</label>
    <button class="btn login-btn" type="submit">Log in</button>
    <p class="login-links"><a href="#" id="login-forgot">Forgotten your password?</a></p>
  </form>
  <p class="login-foot">Not a subscriber? <a href="subscribe.html">Subscribe from 40 som a month</a>.</p>
</div>
